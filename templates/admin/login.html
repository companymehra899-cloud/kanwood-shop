<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login | Kanwood Interiors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-login-page">
  <div class="auth-box">
    <div class="logo" style="margin-bottom:16px;">
      <div class="logo-mark">K</div>
      <div><strong>Kanwood</strong><span>Admin login</span></div>
    </div>
    <p class="dim" style="margin-bottom:14px;font-size:13px;">Full shop admin. Default: admin / kanwood2025</p>
    {% if error %}<p class="note show">{{ error }}</p>{% endif %}
    <form method="post">
      <div class="field"><label>Username</label><input name="username" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-red" type="submit" style="width:100%;">Sign in</button>
    </form>
    <p style="margin-top:14px;font-size:12px;"><a href="/">Back to catalogue</a></p>
  </div>
</body>
</html>
