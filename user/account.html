<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Account | Kanwood Interiors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=s1">
</head>
<body data-page="login" data-root="../">
  <div id="siteHead"></div>
  <div class="pagehead">
    <div class="wrap">
      <div class="crumb"><a href="../index.html">Home</a> / Account</div>
      <h1>My Account</h1>
    </div>
  </div>
  <section class="sec">
    <div class="wrap">
      <div class="cart-layout" id="accountBox">
        <div class="cart-box">
          <h3 style="margin-bottom:12px;">Welcome, <span id="accName"></span></h3>
          <ul class="spec">
            <li>Email: <b id="accEmail"></b></li>
            <li>Phone: <b id="accPhone"></b></li>
          </ul>
          <form id="profileForm" style="margin-top:14px;">
            <div class="field"><label>Name</label><input id="pfName" required></div>
            <div class="field"><label>Phone</label><input id="pfPhone"></div>
            <div class="field"><label>Address</label><textarea id="pfAddress"></textarea></div>
            <div class="two-col">
              <div class="field"><label>City</label><input id="pfCity"></div>
              <div class="field"><label>Pincode</label><input id="pfPin" maxlength="6"></div>
            </div>
            <button class="btn btn-red" type="submit">Save address</button>
            <p class="note" id="pfNote"></p>
          </form>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
            <a class="btn btn-line" href="../product.html">Shop now</a>
            <a class="btn btn-line" href="../cart.html">View cart</a>
            <button class="btn btn-dark" type="button" id="logoutBtn">Logout</button>
          </div>
        </div>
        <aside class="summary">
          <h3>Orders</h3>
          <div id="orderList"><p class="dim">Loading…</p></div>
        </aside>
      </div>
    </div>
  </section>
  <div id="siteFoot"></div>
  <script src="../js/main.js?v=s1"></script>
</body>
</html>
