<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Products | Kanwood Interiors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=s1">
</head>
<body data-page="product" data-root="">
  <div id="siteHead"></div>
  <div class="pagehead">
    <div class="wrap">
      <div class="crumb"><a href="index.html">Home</a> / Product</div>
      <h1>View All Furniture</h1>
    </div>
  </div>
  <section class="sec">
    <div class="wrap shop">
      <aside class="filters">
        <h4>Category</h4>
        <label><input type="checkbox" class="cat-filter" value="home" checked> Home Furniture</label>
        <label><input type="checkbox" class="cat-filter" value="office" checked> Office Furniture</label>
        <label><input type="checkbox" class="cat-filter" value="workstation" checked> Workstation</label>
        <label><input type="checkbox" class="cat-filter" value="institutional" checked> Institutional</label>
        <label><input type="checkbox" class="cat-filter" value="patio" checked> Patio Furniture</label>
        <label><input type="checkbox" class="cat-filter" value="restaurant" checked> Restaurant Furniture</label>
        <label><input type="checkbox" class="cat-filter" value="lockers" checked> Storage Lockers</label>
        <label><input type="checkbox" class="cat-filter" value="cabinets" checked> Cabinets &amp; Wardrobes</label>
        <h4>Deliver to</h4>
        <div class="field">
          <input id="pinInput" placeholder="Enter pincode" maxlength="6">
        </div>
        <button class="btn btn-red" id="pinApply" type="button">Apply</button>
        <p id="pinOut" class="dim" style="margin-top:8px;font-size:12px;color:var(--mute);"></p>
      </aside>
      <div class="prod-grid"></div>
    </div>
  </section>
  <div id="siteFoot"></div>
  <script src="js/main.js?v=s1"></script>
</body>
</html>
